<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - CarMarket Ireland</title>
  <link rel="stylesheet" href="css/home.css">
  <script src="js/register.js"></script>
</head>
<body>

  <header>
    <h1>CarMarket Ireland</h1>
    <nav>
      <a href="home.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <main>
    <section class="post-form" style="max-width: 400px; margin: 40px auto;">
      <h3>Create an Account</h3>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name">
      </div>
      <br>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="your@email.com">
      </div>
      <br>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Choose a password">
      </div>
      <br>
      <button onclick="register()">Create Account</button>
      <p id="message"></p>
      <p style="margin-top: 16px; font-size: 13px;">Already have an account? <a href="login.html">Login here</a></p>
    </section>
  </main>

  <footer>
    <p>CarMarket Ireland &copy; 2026</p>
  </footer>
</body>
</html>
