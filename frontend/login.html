<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - CarMarket Ireland</title>
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <header>
    <h1>CarMarket Ireland</h1>
    <nav>
      <a href="home.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="valuate.html">AI Valuation</a>
    </nav>
  </header>

  <main>
    <div class="login-box">
      <h3>Login to Your Account</h3>
      <br>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="your@email.com">
      </div>
      <br>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password">
      </div>
      <br>
      <button onclick="login()">Login</button>
      <p id="message"></p>
      <p style="margin-top: 16px; font-size: 13px;">No account yet? <a href="register.html">Register here</a></p>
    </div>
  </main>

  <footer>
    <p>CarMarket Ireland &copy; 2026</p>
  </footer>

  <script src="js/login.js"></script>

</body>
</html>
