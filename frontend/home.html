<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarMarket Ireland</title>
  <link rel="stylesheet" href="css/home.css">
  <script src="js/home.js"></script>
</head>

<body>

  <header>
    <h1>CarMarket Ireland</h1>
    <nav>
      <a href="home.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="valuate.html">AI Valuation</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>Buy and Sell Cars in Ireland</h2>
      <p>Browse listings or post your own car for sale.</p>
    </section>

    <section class="post-form">
      <h3>Post a Car for Sale</h3>
      <div class="form-grid">
        <div class="field">
          <label for="make">Make</label>
          <input type="text" id="make" placeholder="e.g. Toyota">
        </div>
        <div class="field">
          <label for="model">Model</label>
          <input type="text" id="model" placeholder="e.g. Corolla">
        </div>
        <div class="field">
          <label for="year">Year</label>
          <input type="number" id="year" placeholder="e.g. 2019">
        </div>
        <div class="field">
          <label for="price">Price (€)</label>
          <input type="number" id="price" placeholder="e.g. 12500">
        </div>
        <div class="field">
          <label for="mileage">Mileage (km)</label>
          <input type="number" id="mileage" placeholder="e.g. 45000">
        </div>
        <div class="field">
          <label for="contact">Contact Email</label>
          <input type="email" id="contact" placeholder="your@email.com">
        </div>
        <div class="field full">
          <label for="description">Description</label>
          <textarea id="description" placeholder="Any extra details..."></textarea>
        </div>
        <div class="field full">
          <label for="images">Photos (up to 5)</label>
          <input type="file" id="images" accept="image/*" multiple>
        </div>
      </div>
      <button onclick="postCar()">List My Car</button>
      <p id="message"></p>
    </section>

    <section class="listings">
      <h3>Current Listings</h3>
      <button onclick="loadCars()">Load Listings</button>
      <div id="listings-container">
        <p>Click "Load Listings" to see cars.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>CarMarket Ireland &copy; 2026</p>
  </footer>

</body>

</html>
